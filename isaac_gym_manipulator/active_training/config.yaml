# Active RL training config (isaac-training style)

# voxel grid
voxel:
  size: [32,32,32]
  channels: 1
  use_incremental_update: true  # 是否使用增量体素更新（内存优化）
  decay_factor: 0.95             # 体素占据概率衰减因子（仅增量更新模式）

# env (Isaac Gym UR10e)
env:
  num_envs: 2  # 支持多环境并行训练（建议4-16）
  max_steps: 1200
  img_w: 640
  img_h: 480
  fov_deg: 87.0
  max_range: 3.0                   # 深度相机最大范围（米），用于体素构建
  
  # GPU device settings (for server training with multiple GPUs)
  gpu_device_id: 0                 # PyTorch和Isaac Gym使用的GPU设备号 (0, 1, 2, ...)
                                    # 在服务器上训练时，修改此值以指定使用的GPU
                                    # 例如: gpu_device_id: 1 表示使用GPU 1
  
  # Visualization settings
  enable_viewer: false             # 启用 Isaac Gym 可视化窗口
  camera_pos: [1.5, -1.5, 1.2]    # 视口相机位置 [x, y, z] - 从侧面/上方观看机械臂
  camera_target: [0.0, 0.0, 0.6]  # 视口相机目标 [x, y, z] - 看向机械臂中心略上方
  render_freq: 1                  # 渲染频率（每N步渲染一次，10=每10步渲染一次，降低频率以提高性能）
  visualize_env_index: 0           # 只可视化第一个环境（env 0）
  
  action_dim: 6                    # 关节角度增量维度 [dq1, dq2, dq3, dq4, dq5, dq6]（弧度）
  action_limit: 0.1                # 关节角度增量限制（弧度/步）- 增大以鼓励更大的动作幅度
  
  # PD控制器参数（位置控制模式）
  # 前3个关节（shoulder_pan, shoulder_lift, elbow）
  stiffness_base: 8000.0          # 基础关节刚度（前3个关节）- 增大以支持更大的动作幅度
  damping_base: 200.0             # 基础关节阻尼（前3个关节）- 修复：与env.py默认值一致
  # 后3个关节（wrist_1, wrist_2, wrist_3）
  stiffness_wrist: 7000.0         # 腕部关节刚度（后3个关节）- 增大以支持更大的动作幅度
  damping_wrist: 200.0            # 腕部关节阻尼（后3个关节）- 修复：与env.py默认值一致

  # ArUco / target discovery
  target_confirm_steps: 3   # 降低确认步数以提高episode完成率
  aruco_safe_radius: 0.30         # 目标点周围的无障碍安全半径
  los_clearance: 0.25             # 视线保护走廊的最小半径
  
  # ArUco位置范围限制
  target_pos_range_x: [0.5, 1.2]  # ArUco X坐标范围（m）
  target_pos_range_y: [-0.5, 0.5] # ArUco Y坐标范围（m）
  target_pos_range_z: [0.0, 0.6] # ArUco Z坐标范围（m）
  
  # ArUco随机旋转角度范围（欧拉角，度）
  target_rotation_range: [-180, 180]  # 绕Z轴旋转范围（yaw）

  # Workspace constraints (cylindrical)
  workspace_radius: 1.4           # 可达半径
  workspace_z: [0.05, 1.2]        # 可达高度范围

  # Spherical obstacles (static)
  obstacles_num: 5
  obstacle_radius_min: 0.10
  obstacle_radius_max: 0.30
  obstacle_min_spacing: 0.40
  keepout_base_radius: 0.60       # 基座周围禁放半径
  keepout_target_margin: 0.05     # 目标额外安全边界（和球半径、aruco_safe_radius叠加）
  
  # Dynamic obstacles (moving)
  num_dynamic_obstacles: 3        # 动态障碍物数量（每个环境）
  dynamic_obstacle_radius_min: 0.08  # 动态障碍物半径范围
  dynamic_obstacle_radius_max: 0.15
  dynamic_obstacle_vel_range: [0.05, 0.10]  # 速度范围（m/s）
  dynamic_obstacle_local_range: [0.4, 0.4, 0.3]  # 局部移动范围 [x, y, z]（相对于原点）
  dynamic_obstacle_goal_threshold: 0.2  # 到达目标的距离阈值（m）
  dynamic_obstacle_vel_update_interval: 2.0  # 速度更新间隔（秒）
  num_closest_dyn_obs: 3  # 检测最近的N个动态障碍物（参考isaac-training，提高效率）

# rewards (简化的两阶段奖励系统)
reward:
  # === 论文核心参数 ===
  # 障碍物惩罚（论文公式：ω2·Σψi）
  omega2: 0.1                    # 障碍物惩罚系数
  d_max: 0.05                    # 安全距离阈值（5cm）
  # === 发现ArUco后的靠近奖励（端到端到达目标奖励） ===
  # 只在发现目标后应用，鼓励机械臂靠近并到达目标
  # 1. 位置误差惩罚: -ω₁e² (误差越大，惩罚越大)
  # 2. 零误差鼓励: ln(e² + τₑ) (误差越小，奖励越大；误差为0时奖励最大)
  # e = ||pt - pe|| (末端执行器与目标的欧氏距离)
  omega1: 0.001                  # 误差权重系数（10^-3）
  tau_e: 0.0001                  # 误差阈值（10^-4）
  
  # === 简化奖励参数 ===
  # 探索奖励（未发现阶段）
  wrist_movement_coef: 2.0       # 末端平移奖励（避免静止）
  view_change_coef: 0.15         # 相机朝向变化奖励
  
  # === 发现和多角度观察奖励 ===
  discovery_bonus: 100.0             # 目标发现奖励（一次性）
  new_angle_bonus: 0.2             # 新角度观察奖励（30度差异视为新角度）
  multiview_movement_bonus: 0.1    # 多角度观察时的运动奖励（末端摆动）
  multiview_continuation_bonus: 0.05  # 持续多角度观察奖励（前10步递增）
  angle_coverage_bonus: 0.15       # 多角度覆盖奖励（观察到4+个角度）
  multiview_angle_threshold: 30.0  # 新角度阈值（度，小于此值视为同一角度）
  
  # === 末端转动奖励（在未知条件下，鼓励末端多角度探索） ===
  wrist_rotation_coef: 25.0        # 末端转动奖励系数（基础旋转奖励）- 进一步增大以鼓励更多旋转
  wrist_rotation_threshold: 0.05    # 最小旋转阈值（度，小于此值不奖励）- 进一步降低阈值使更容易触发奖励
  wrist_rotation_continuation_coef: 12.0  # 连续转动奖励系数（鼓励持续转动）- 进一步增大以鼓励持续旋转
  wrist_no_rotation_penalty: 100.0  # 末端不转动惩罚系数（在未知条件下，如果末端不转动则惩罚）- 进一步增大惩罚以强制旋转
  
  # === Z轴向上探索奖励（在未知条件下，鼓励向上探索） ===
  upward_exploration_coef: 10.0    # Z轴向上探索奖励系数
  upward_exploration_threshold: 0.01  # 最小向上移动阈值（米，小于此值不奖励）
  upward_exploration_max_reward_height: 1.0  # 最大奖励的高度阈值（米，超过此高度不再额外奖励）

# ppo
ppo:
  rollout_steps: 128         # 从32增加到64，提高episode完成率（参考：isaac-training用16但有256并行环境）
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.01
  max_grad_norm: 5.0        # 参考isaac-training使用5.0（实际在代码中硬编码）
  lr: 0.0001
  epochs: 5
  batch_size: 1024
  
  # 训练稳定性参数（新增）
  target_kl: 0.02           # KL早停阈值，超过此值提前终止epoch循环
  adv_clip: 999.0           # Advantage裁剪范围（大幅增大或禁用，isaac-training中不裁剪advantage）
  critic_clip_ratio: 0.5    # Critic价值裁剪比例（增大以允许更大的value变化）
  value_norm_beta: 0.995    # ValueNorm的beta值（越大更新越慢，isaac-training标准是0.995）
  
  # 学习率调度（可选，默认关闭）
  use_lr_scheduler: true   # 是否启用学习率调度
  lr_decay_steps: 1000      # 学习率衰减步数（CosineAnnealingLR）
  
  # 分离学习率（可选，默认与lr相同）
  feature_lr: 0.0001       # Feature extractor学习率
  actor_lr: 0.0001          # Actor学习率
  critic_lr: 0.0001         # Critic学习率（降低以稳定训练）
  
  # 动作集成策略（泊松分布采样）
  use_action_ensemble: true  # 是否启用动作集成策略（默认关闭）
  ensemble_alpha: 12.0        # 泊松分布参数α（默认12）
  # 设计原理：
  # - β = 1 + α * (current_episode / total_episodes)
  # - 训练初期：en/ea ≈ 0 → β ≈ 1 → 采样次数少 → 探索性强
  # - 训练后期：en/ea ≈ 1 → β ≈ 1+α → 采样次数多 → 利用性强
  
  # 自适应折扣因子（基于策略概率）
  use_adaptive_gamma: true   # 是否启用自适应折扣因子（默认关闭）
  eta_min: 0.6              # 最小折扣因子（策略不确定时使用）
  eta_max: 0.99             # 最大折扣因子（策略自信时使用）
  # 设计原理：
  # - γ(s, a; η) = clip(π(s, a), η_min, η_max)
  # - 当 π(s,a) 高时: γ ≈ η_max → 关注长期回报（策略自信）
  # - 当 π(s,a) 低时: γ ≈ η_min → 关注即时奖励（策略不确定）

# train
train:
  total_iterations: 5000
  log_interval: 10
  save_interval: 100
  checkpoint_dir: checkpoints_active_training
